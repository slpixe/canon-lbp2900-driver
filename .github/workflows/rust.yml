name: Experimental Rust checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux CUPS headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev clang
      - name: Install pinned official Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Core, C differential and real CUPS adapter checks (offline)
        run: ./scripts/test-rust.sh
      - name: Review C adapter
        run: |
          cc --version
          clang --analyze -D_DARWIN_C_SOURCE -D_POSIX_C_SOURCE=200809L -std=c11 -Wall -Wextra -Werror -Xanalyzer -analyzer-werror -o /dev/null rust/adapter/cups.c
      - name: Build separate Apple Silicon experiment
        if: runner.os == 'macOS'
        run: |
          ./scripts/build-rust.sh
          mkdir -p build/rust/ppd-root/usr/libexec/cups/filter
          install -m 0755 build/rust/rastertocapt-lbp2900-rust build/rust/ppd-root/usr/libexec/cups/filter/
          cupstestppd -R "$PWD/build/rust/ppd-root" -q build/rust/CanonLBP2900-Rust-Experimental.ppd
          file build/rust/rastertocapt-lbp2900-rust
          otool -L build/rust/rastertocapt-lbp2900-rust
      # No artifact upload or release: experimental executables are not distributed.
